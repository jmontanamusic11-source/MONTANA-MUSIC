name: Build MONTANA MUSIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-background-media

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install
      - name: Preparar aplicación web
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Instalar plataforma Android
        run: npx cap add android
      - name: Aplicar reproductor nativo Media3
        run: node scripts/patch-android-native.mjs
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Preparar Gradle
        run: chmod +x android/gradlew
      - name: Compilar APK
        run: cd android && ./gradlew assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MONTANA-MUSIC-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
